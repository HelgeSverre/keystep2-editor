<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyStep mk2 pattern editor</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400 700; font-display: swap; src: url(fonts/inter-400-700.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; font-display: swap; src: url(fonts/barlow-semi-condensed-500.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; font-display: swap; src: url(fonts/barlow-semi-condensed-600.woff2) format("woff2"); }

  /*
   * Skins. A skin is a block of custom properties on :root[data-skin="…"]; components read only
   * these tokens, and the piano roll reads them from the root at draw time. To add a skin, copy a
   * block, change the values and add a button with data-skin to #skins.
   *
   *   --bg            window background, and the wash over steps past the pattern length
   *   --panel         toolbar, side panes, ruler, velocity lane
   *   --surface       input fields; white-key rows of the roll
   *   --sunken        pressed buttons; black-key rows of the roll
   *   --ink / --muted primary and secondary text
   *   --label         pane headings and units (the device's secondary-function lettering)
   *   --line / --line-strong   hairlines; beat lines and hover outlines
   *   --btn-bg / --btn-edge    button face and outline
   *   --select / --on-select   pressed and selected state (the device's Shift button)
   *   --note          notes and velocity bars
   *   --accent        selected note, focus ring, warnings
   *   --playhead      playing step
   *   --hover         wash over the key lane under the pointer
   *   --key-white / --key-black   keyboard strip beside the roll
   *   --display-bg / --display-ink   file readout (the device's OLED)
   *   --radius        corner radius of buttons and fields
   *   --font / --font-label / --mono   text, button and heading lettering, hex
   *   --label-case / --label-track     heading capitalisation and tracking
   */
  :root, :root[data-skin="light"] {
    color-scheme: light;
    --bg: #d6d6da;
    --panel: #e5e5e7;
    --surface: #f4f4f6;
    --sunken: #d9d9dd;
    --ink: #1e1e20;
    --muted: #63636b;
    --label: #046a99;
    --line: #c9c8cc;
    --line-strong: #a9a7ab;
    --btn-bg: #eeeef0;
    --btn-edge: #b4b2b5;
    --select: #0580b8;
    --on-select: #ffffff;
    --note: #0580b8;
    --accent: #1e1e20;
    --playhead: #0580b8;
    --hover: rgba(255, 255, 255, 0.6);
    --key-white: #f6f5f8;
    --key-black: #141415;
    --display-bg: #1b1a1b;
    --display-ink: #b4e6f1;
    --radius: 4px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-label: "Barlow Semi Condensed", "Avenir Next Condensed", "Arial Narrow", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --label-case: none;
    --label-track: 0.01em;
  }
  :root[data-skin="dark"] {
    color-scheme: dark;
    --bg: #101012;
    --panel: #1b1b1e;
    --surface: #242428;
    --sunken: #151517;
    --ink: #ececee;
    --muted: #9a9aa3;
    --label: #56b9e3;
    --line: #333338;
    --line-strong: #55555d;
    --btn-bg: #27272b;
    --btn-edge: #4b4b53;
    --select: #0a8fcc;
    --on-select: #ffffff;
    --note: #35a7de;
    --accent: #ffffff;
    --playhead: #35a7de;
    --hover: rgba(255, 255, 255, 0.07);
    --key-white: #d9d9de;
    --key-black: #070708;
    --display-bg: #000000;
    --display-ink: #b4e6f1;
  }
  /* Charcoal neutrals and yellow accent, after ../terminal's theme. */
  :root[data-skin="classic"] {
    color-scheme: dark;
    --bg: #0a0a0b;
    --panel: #111113;
    --surface: #1b1c1f;
    --sunken: #141416;
    --ink: #e6e6e6;
    --muted: #8e8f96;
    --label: #b4b5ba;
    --line: #26272b;
    --line-strong: #3d3e44;
    --btn-bg: #1b1c1f;
    --btn-edge: #2e2e34;
    --select: #facc15;
    --on-select: #111113;
    --note: #facc15;
    --accent: #ffffff;
    --playhead: #facc15;
    --hover: rgba(255, 255, 255, 0.05);
    --key-white: #c9c9cf;
    --key-black: #0a0a0b;
    --display-bg: transparent;
    --display-ink: #e6e6e6;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-label: var(--font);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    font: 12.5px/1.35 var(--font);
    font-variant-numeric: tabular-nums;
    background: var(--bg); color: var(--ink);
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #shell { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--btn-bg); border: 1px solid var(--btn-edge); border-radius: var(--radius);
    padding: 3px 10px; height: 26px; white-space: nowrap;
    font-family: var(--font-label); font-weight: 500; font-size: 13px; letter-spacing: var(--label-track);
  }
  button:hover:not(:disabled) { border-color: var(--line-strong); }
  button:active:not(:disabled) { background: var(--sunken); }
  button:disabled { opacity: 0.4; }
  button[aria-pressed="true"] { background: var(--select); color: var(--on-select); border-color: var(--select); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, select {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    height: 24px; padding: 1px 6px; user-select: text; -webkit-user-select: text;
  }

  /* Toolbar: document and editing on the left, transport in the middle, device and skin on the right */
  .toolbar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px 16px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .toolbar .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .toolbar .side.end { justify-content: flex-end; }
  .toolbar .grp { display: flex; flex: none; }
  .toolbar .grp button { border-radius: 0; margin-left: -1px; }
  .toolbar .grp button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .toolbar .grp button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .toolbar .grp button:only-child { border-radius: var(--radius); }
  .toolbar .grp button:hover:not(:disabled), .toolbar .grp button[aria-pressed="true"] { position: relative; }
  .toolbar .wordmark { font-family: var(--font-label); font-size: 17px; font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; color: var(--muted); }
  .toolbar .wordmark b { font-weight: 600; color: var(--ink); }
  .toolbar .wordmark span { color: var(--label); font-size: 13px; margin-left: 5px; }
  .toolbar .doc {
    padding: 0 10px; height: 24px; line-height: 24px; border-radius: var(--radius); min-width: 0;
    background: var(--display-bg); color: var(--display-ink); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toolbar .doc:empty { display: none; }
  .toolbar .doc b { font-weight: 600; }
  .toolbar .doc .dirty { opacity: 0.7; }
  #playBtn { min-width: 64px; font-weight: 600; }
  #midiBtn::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
    background: var(--line-strong); vertical-align: 1px;
  }
  #midiBtn[aria-pressed="true"] { background: var(--btn-bg); color: var(--ink); border-color: var(--btn-edge); }
  #midiBtn[aria-pressed="true"]::before { background: var(--select); }
  .skins { display: flex; flex: none; gap: 2px; margin-left: 2px; }
  .skins button {
    width: 24px; height: 24px; padding: 0; border: 0; background: none; color: var(--ink); opacity: 0.4;
    display: grid; place-items: center;
  }
  .skins button:hover:not(:disabled) { opacity: 0.8; background: none; }
  .skins button[aria-pressed="true"] { opacity: 1; background: none; color: var(--ink); }
  .skins svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .skins button[aria-pressed="true"] svg { stroke-width: 2; }
  @media (max-width: 1180px) {
    .toolbar { grid-template-columns: 1fr; }
    .toolbar .side, .toolbar .side.end { flex-wrap: wrap; justify-content: flex-start; }
  }

  /* Workspace */
  #work { display: grid; grid-template-columns: 208px minmax(0, 1fr) 272px; min-height: 0; }
  .pane { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
  .pane h2 {
    font-family: var(--font-label); font-size: 13px; font-weight: 500; color: var(--label); margin: 0;
    padding: 8px 10px 6px; text-transform: var(--label-case); letter-spacing: var(--label-track);
  }

  /* Patterns pane */
  #patterns { border-right: 1px solid var(--line); }
  .banks { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 10px 8px; }
  .banks button { border-radius: 0; margin-left: -1px; padding: 0; }
  .banks button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .banks button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .banks button[aria-pressed="true"] { position: relative; }
  #slots { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-auto-rows: minmax(26px, 1fr); border-top: 1px solid var(--line); }
  .slot {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) 22px; gap: 6px; align-items: center;
    height: auto; min-height: 0; padding: 2px 10px; border: 0; border-radius: 0; background: transparent; text-align: left;
    border-bottom: 1px solid var(--line);
  }
  .slot:hover:not([aria-pressed="true"]) { background: var(--surface); }
  .slot svg { width: 100%; height: 100%; max-height: 30px; min-height: 14px; display: block; }
  .slot svg rect { fill: var(--note); }
  .slot { font-family: var(--font); font-size: 12.5px; letter-spacing: 0; }
  .slot .num { font-weight: 600; text-align: right; }
  .slot .len { color: var(--label); font-size: 11px; text-align: right; }
  .slot[aria-pressed="true"] { background: var(--select); color: var(--on-select); }
  .slot.empty .num { color: var(--muted); font-weight: 400; }
  .slot[aria-pressed="true"] svg rect { fill: var(--on-select); }
  .slot[aria-pressed="true"] .len { color: var(--on-select); opacity: 0.8; }
  .slot-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 8px 10px; border-top: 1px solid var(--line); }
  .slot-actions button { padding: 0; }

  /* Roll */
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); }
  canvas#roll { grid-row: 2; min-height: 0; }

  /* Device transfer header, shown above the roll while reading or sending */
  #xfer {
    grid-row: 1; padding: 16px 20px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: end;
  }
  #xfer .what { font: 500 13px var(--font-label); color: var(--label); }
  #xfer .big { font: 600 30px/1.05 var(--font-label); letter-spacing: 0.01em; }
  #xfer .big span { color: var(--muted); font-weight: 500; }
  #xfer .time { text-align: right; color: var(--muted); }
  #xfer .time strong { display: block; font: 600 20px/1.1 var(--font-label); color: var(--ink); }
  #xfer .track { grid-column: 1 / -1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 14px; margin-top: 6px; }
  #xfer .track i { background: var(--sunken); border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  #xfer .track.banked i:nth-child(16n + 1):not(:first-child) { margin-left: 5px; }
  #xfer .track i.done { background: var(--select); border-color: var(--select); }
  #xfer .track i.now::after { content: ""; position: absolute; inset: 0; width: var(--w, 0%); background: var(--select); }
  #xfer .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; color: var(--muted); }
  #xfer .banks { display: grid; grid-template-columns: repeat(4, 1fr); flex: 1; font-size: 11.5px; }
  #xfer #xferNote { flex: 1; font-size: 11.5px; }
  canvas#roll { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; outline: none; }
  #drop {
    position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px;
    color: var(--muted); font-size: 15px; pointer-events: none; text-align: center; padding: 0 24px;
  }
  #drop .how { font-size: 12.5px; max-width: 46ch; }
  body.dragover #stage { box-shadow: inset 0 0 0 2px var(--accent); }

  /* Inspector */
  #inspector { border-left: 1px solid var(--line); overflow-y: auto; }
  .group { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .rows { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 8px; align-items: center; padding: 0 10px; }
  .rows label { color: var(--muted); }
  .rows input, .rows select { width: 100%; }
  .rows .with-unit { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
  .rows .unit { color: var(--label); font-size: 11.5px; white-space: nowrap; }
  .empty-note { color: var(--muted); padding: 0 10px 2px; }
  .group .wide { margin: 8px 10px 0; width: calc(100% - 20px); }
  .group .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 10px 0; }

  details#raw summary { font-family: var(--font-label); font-size: 13px; font-weight: 500; color: var(--label); padding: 8px 10px; }
  #rawBody { padding: 0 10px 12px; user-select: text; -webkit-user-select: text; }
  #rawBody h3 { font-size: 11.5px; font-weight: 600; margin: 10px 0 4px; }
  #rawBody h3:first-child { margin-top: 0; }
  #rawBody dl { margin: 0; }
  #rawBody dt { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  #rawBody dd { margin: 0; }
  #rawBody table { border-collapse: collapse; width: 100%; }
  #rawBody th { text-align: left; font-weight: 400; color: var(--muted); padding: 1px 6px 1px 0; }
  #rawBody td { padding: 1px 6px 1px 0; }
  .hex { font-family: var(--mono); font-size: 11px; }
  .bad { color: var(--accent); font-weight: 600; }
  #rawBody p { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }

  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 16px 18px; max-width: 420px; font: inherit;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog p { margin: 0 0 14px; font-size: 13.5px; line-height: 1.45; }
  dialog form { display: flex; justify-content: flex-end; gap: 8px; }
  dialog #confirmOk { background: var(--select); color: var(--on-select); border-color: var(--select); }

  /* Status bar */
  .statusbar {
    display: flex; gap: 16px; align-items: center; padding: 4px 10px; height: 24px;
    background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px;
    white-space: nowrap; overflow: hidden;
  }
  .statusbar #status { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .statusbar #status.alert { color: var(--accent); }
</style>
</head>
<body>
<div id="shell">
  <header class="toolbar">
    <div class="side">
      <span class="wordmark">KEY<b>STEP</b><span>mk2 editor</span></span>
      <div class="grp" role="group" aria-label="File">
        <button id="openBtn" title="Open a .keystep2 project (Cmd/Ctrl+O)">Open…</button>
        <button id="saveBtn" disabled title="Save a copy (Cmd/Ctrl+S). The opened file is not overwritten.">Save a copy…</button>
      </div>
      <div class="grp" role="group" aria-label="Edit">
        <button id="undoBtn" disabled title="Undo (Cmd/Ctrl+Z)">Undo</button>
        <button id="redoBtn" disabled title="Redo (Shift+Cmd/Ctrl+Z)">Redo</button>
      </div>
      <span class="doc" id="fileLabel"></span>
    </div>
    <div class="grp" role="group" aria-label="Playback and view">
      <button id="playBtn" aria-pressed="false" disabled title="Play or stop (Space)">Play</button>
      <button id="soundBtn" aria-pressed="true" title="Play notes as you add or move them">Audition</button>
      <button id="fitBtn" disabled title="Show the whole pattern (F)">Fit</button>
    </div>
    <div class="side end">
      <div class="grp" role="group" aria-label="Device">
        <button id="midiBtn" aria-pressed="false" title="Connect to a KeyStep mk2 over USB (Chrome or Edge)">Connect KeyStep</button>
        <button id="readAllBtn" disabled title="Read all 64 patterns from the device into a new project">Read all</button>
        <button id="readOneBtn" disabled title="Replace this slot with the same slot from the device">Read pattern</button>
        <button id="sendBtn" disabled title="Write this pattern to the same slot on the device">Send pattern</button>
        <button id="sendAllBtn" disabled title="Write every pattern that holds data here to the device. Empty slots are skipped.">Send all</button>
      </div>
  <div class="skins" id="skins" role="group" aria-label="Skin">
      <button data-skin="light" aria-pressed="false" aria-label="Light skin" title="Light">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg>
      </button>
      <button data-skin="dark" aria-pressed="false" aria-label="Dark skin" title="Dark">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7z"/></svg>
      </button>
      <button data-skin="classic" aria-pressed="false" aria-label="Classic skin" title="Classic (charcoal)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8a6.2 6.2 0 1 0 0 12.4c1 0 1.5-.6 1.5-1.3 0-.9-.8-1.2-.8-2 0-.7.6-1.2 1.4-1.2h1.6a2.5 2.5 0 0 0 2.5-2.5C14.2 4.2 11.4 1.8 8 1.8z"/><circle cx="5" cy="7" r=".6"/><circle cx="7.2" cy="4.6" r=".6"/><circle cx="10.4" cy="5.2" r=".6"/></svg>
      </button>
    </div>
    </div>
    <input type="file" id="fileInput" accept=".keystep2" hidden>
  </header>

  <div id="work">
    <aside class="pane" id="patterns" aria-label="Patterns">
      <h2>Bank</h2>
      <div class="banks" id="banks"></div>
      <div id="slots"></div>
      <div class="slot-actions">
        <button id="copyBtn" disabled title="Copy this pattern">Copy</button>
        <button id="pasteBtn" disabled title="Paste over this slot">Paste</button>
        <button id="clearBtn" disabled title="Remove all notes from this pattern">Clear</button>
      </div>
    </aside>

    <main id="stage">
      <div id="xfer" hidden>
        <div><div class="what" id="xferTitle"></div><div class="big" id="xferBig"></div></div>
        <div class="time"><strong id="xferLeft"></strong><span id="xferElapsed"></span></div>
        <div class="track" id="xferTrack"></div>
        <div class="foot"><div class="banks" id="xferBanks"><span>Bank 1</span><span>Bank 2</span><span>Bank 3</span><span>Bank 4</span></div>
          <span id="xferNote"></span><button id="xferCancel">Cancel</button></div>
      </div>
      <canvas id="roll" tabindex="0" aria-label="Piano roll"></canvas>
      <div id="drop">
        <span>Empty project</span>
        <span class="how">Click the grid to start a pattern, drop a .keystep2 file here, or connect a KeyStep and read a slot.</span>
      </div>
    </main>

    <aside class="pane" id="inspector" aria-label="Inspector">
      <section class="group"><h2>Pattern</h2><div class="rows" id="settings"></div>
        <button class="wide" id="doubleBtn" disabled>Double pattern</button></section>
      <section class="group"><h2>Note</h2><div id="noteBox"></div></section>
      <details id="raw"><summary>Raw bytes</summary><div id="rawBody"></div></details>
    </aside>
  </div>

  <dialog id="confirmDlg">
    <p id="confirmText"></p>
    <form method="dialog"><button value="cancel">Cancel</button><button value="ok" id="confirmOk">OK</button></form>
  </dialog>

  <footer class="statusbar">
    <span id="status" role="status" aria-live="polite"></span>
    <span id="where"></span>
    <span id="checksum"></span>
  </footer>
</div>

<script src="keystep2.js"></script>
<script src="keystep2-midi.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- state -----------------------------------------------------------------
let file = null, fileName = '', dirty = false;
let bank = 1, number = 1, P = null;
let steps = [];                 // 64 arrays of notes { n, v, l, x, s }; s = step index, kept by this file only
let selection = new Set();      // selected notes
let undoStack = [], redoStack = [], clipboard = null;
let lastVel = 100, lastLen = 2;
let soundOn = true;
let pristine = false;            // the untouched empty project the editor starts with
let hover = null;               // { zone, pitch }
let box = null;                 // selection rectangle { s0, p0, s1, p1 } in step and pitch units
let heldKey = -1;               // key pressed on the keyboard strip
const lit = new Map();          // pitch -> time (ms) until which its key shows as sounding

// ---- view: continuous pan and zoom -------------------------------------------
// step0 = step at the left edge, colW = pixels per step, top = pitch edge at the top (128 = above G9),
// rowH = pixels per key.
const KEYW = 52, RULER = 20, VGAP = 8, VELH = 76;
const view = { step0: 0, colW: 0, top: 84, rowH: 14 };
const canvas = $('roll'), ctx = canvas.getContext('2d');
const BLACK = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
const wide = () => Math.max(1, canvas.clientWidth - KEYW);
const tall = () => Math.max(1, canvas.clientHeight - RULER - VGAP - VELH);
const velTop = () => canvas.clientHeight - VELH;
const xOf = (step) => KEYW + (step - view.step0) * view.colW;
const yOf = (pitch) => RULER + (view.top - 1 - pitch) * view.rowH;
const stepAt = (x) => view.step0 + (x - KEYW) / view.colW;
const pitchAt = (y) => Math.ceil(view.top - (y - RULER) / view.rowH) - 1;

function clampView() {
  const w = wide(), h = tall();
  view.colW = clamp(view.colW || 0, w / 64, 72);
  view.step0 = clamp(view.step0, 0, 64 - w / view.colW);
  view.rowH = clamp(view.rowH, Math.max(5, h / 128), 30);
  view.top = clamp(view.top, h / view.rowH, 128);
}

/** Centres the keys on the pattern's notes; keeps the zoom. */
function centreKeys() {
  const pitches = steps.flat().map((o) => o.n);
  const mid = pitches.length ? (Math.min(...pitches) + Math.max(...pitches) + 1) / 2 : 60;
  view.top = mid + tall() / view.rowH / 2;
  clampView();
}

/** Whole pattern in view at the default key height. */
function fitAll() {
  view.colW = 0; view.step0 = 0; view.rowH = 14;
  clampView(); centreKeys(); draw();
}

function reveal(note) {
  if (note.n >= view.top - 1) view.top = note.n + 2;
  if (note.n < view.top - tall() / view.rowH + 1) view.top = note.n - 1 + tall() / view.rowH;
  if (note.s < view.step0) view.step0 = note.s;
  if (note.s + 1 > view.step0 + wide() / view.colW) view.step0 = note.s + 1 - wide() / view.colW;
  clampView();
}

// ---- file ------------------------------------------------------------------
async function openFile(f) {
  try {
    loadBytes(new Uint8Array(await f.arrayBuffer()), f.name);
  } catch (e) {
    say(e.message, true);
  }
}

function loadBytes(bytes, name) {
  const parsed = KS2.parse(bytes);
  stop();
  file = parsed; fileName = name; dirty = false;
  undoStack = []; redoStack = []; clipboard = null;
  pristine = false;
  const first = [...file.patterns.values()].filter((p) => !KS2.isEmpty(p.blob))
    .sort((a, b) => a.bank - b.bank || a.number - b.number)[0];
  selectPattern(first ? first.bank : 1, first ? first.number : 1);
}

async function saveCopy() {
  if (!file) return;
  const out = KS2.serialize(file);
  const name = fileName.replace(/\.keystep2$/i, '').replace(/-edited$/, '') + '-edited.keystep2';
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'KeyStep mk2 project', accept: { 'application/octet-stream': ['.keystep2'] } }],
      });
      const w = await handle.createWritable();
      await w.write(out); await w.close();
      dirty = false; renderChrome(); say(`Saved ${handle.name}`);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false; renderChrome(); say(`Saved ${name} to Downloads`);
}

// ---- pattern selection and edits -------------------------------------------
const getPattern = (b, n) => file.patterns.get(KS2.patternKey(b, n));
const isBlank = (p) => KS2.isEmpty(p.blob);
const patternLength = () => KS2.getParam(P, 'length');

function loadSteps() {
  steps = isBlank(P) ? Array.from({ length: 64 }, () => []) : KS2.readSteps(P.blob);
  steps.forEach((notes, s) => notes.forEach((o) => { o.s = s; }));
}

function selectPattern(b, n, keepView) {
  bank = b; number = n; P = getPattern(b, n); selection = new Set(); box = null;
  loadSteps();
  clampView();
  if (!keepView) centreKeys();
  renderAll();
}

function snapshot() {
  pristine = false;
  undoStack.push({ bank, number, blob: P.blob.slice(), params: { ...P.params }, bias: P.bias });
  if (undoStack.length > 300) undoStack.shift();
  redoStack = []; dirty = true;
}

function restore(from, to) {
  const s = from.pop();
  if (!s) return;
  const p = getPattern(s.bank, s.number);
  to.push({ bank: s.bank, number: s.number, blob: p.blob.slice(), params: { ...p.params }, bias: p.bias });
  p.blob = s.blob; p.params = s.params; p.bias = s.bias;
  dirty = true;
  selectPattern(s.bank, s.number, s.bank === bank && s.number === number);
}

/** Runs an edit as one undo step; the snapshot is dropped again if the edit changed nothing. */
function edit(fn) {
  const redo = redoStack, wasDirty = dirty;
  snapshot();
  const changed = fn();
  if (!changed) { undoStack.pop(); redoStack = redo; dirty = wasDirty; }
  renderAll();
  return changed;
}

/** Turns an empty slot into a blank pattern the first time something is written to it. */
function ensureData() {
  if (isBlank(P)) { P.blob = KS2.initBlob(P.params); P.bias = KS2.CHECKSUM_BIAS; P.checksumOk = true; }
}

function commit(indices) {
  ensureData();
  for (const i of new Set(indices)) if (i >= 0 && i < 64) KS2.writeStep(P.blob, i, steps[i]);
  KS2.updateChecksum(P);
}

const FULL = 'A step holds at most 8 notes.';

/**
 * Moves notes to new places, all or none. `targets` is [{ note, s, n }]; a note not yet in the
 * pattern (a copy) is added. Returns false when a place is out of range, taken, or the step is full.
 */
function place(targets) {
  const moving = new Set(targets.map((t) => t.note)), seen = new Set(), incoming = new Map();
  for (const t of targets) {
    if (t.s < 0 || t.s > 63 || t.n < 0 || t.n > 127) return false;
    const key = t.s * 128 + t.n;
    if (seen.has(key)) return false;
    seen.add(key);
    incoming.set(t.s, (incoming.get(t.s) || 0) + 1);
    if (steps[t.s].some((o) => !moving.has(o) && o.n === t.n)) return false;
  }
  for (const [s, count] of incoming) {
    if (steps[s].filter((o) => !moving.has(o)).length + count > KS2.SLOT_COUNT) { say(FULL, true); return false; }
  }
  const touched = [];
  for (const t of targets) {
    const at = steps[t.note.s] ? steps[t.note.s].indexOf(t.note) : -1;
    if (at >= 0) { steps[t.note.s].splice(at, 1); touched.push(t.note.s); }
  }
  for (const t of targets) { t.note.s = t.s; t.note.n = t.n; steps[t.s].push(t.note); touched.push(t.s); }
  commit(touched);
  return true;
}

function addNote(step, pitch) {
  const note = { n: pitch, v: lastVel, l: lastLen, x: 0, s: -1 };
  return place([{ note, s: step, n: pitch }]) ? note : null;
}

function removeNotes(notes) {
  const touched = [];
  for (const o of notes) {
    const at = steps[o.s].indexOf(o);
    if (at >= 0) { steps[o.s].splice(at, 1); touched.push(o.s); }
    selection.delete(o);
  }
  if (touched.length) commit(touched);
  return touched.length > 0;
}

const picked = () => [...selection];
const single = () => (selection.size === 1 ? picked()[0] : null);

function moveSelection(dS, dP) {
  return place(picked().map((o) => ({ note: o, s: o.s + dS, n: o.n + dP })));
}

function stretchSelection(by) {
  let changed = false;
  for (const o of selection) {
    const l = clamp(o.l + by, 1, KS2.MAX_NOTE_LENGTH);
    if (l !== o.l) { o.l = l; changed = true; }
  }
  if (changed) { commit(picked().map((o) => o.s)); lastLen = picked()[0].l; }
  return changed;
}

/** The selected notes once more, right after themselves. */
function duplicateSelection() {
  if (!selection.size) { say('Select notes to duplicate.'); return; }
  const notes = picked();
  const from = Math.min(...notes.map((o) => o.s)), to = Math.max(...notes.map((o) => o.s + o.l / 2));
  const by = Math.max(1, Math.ceil(to - from - 1e-9));
  const copies = notes.map((o) => ({ note: { n: o.n, v: o.v, l: o.l, x: o.x, s: -1 }, s: o.s + by, n: o.n }));
  const ok = edit(() => place(copies));
  if (!ok) { say('No room to duplicate: the copies would overlap notes or pass step 64.', true); return; }
  selection = new Set(copies.map((c) => c.note));
  reveal(copies[0].note);
  renderAll();
}

/** Repeats steps 1..length after the end and doubles the length. */
function doublePattern() {
  const len = patternLength();
  if (isBlank(P)) return;
  if (len * 2 > 64) { say(`A pattern holds 64 steps; ${len} cannot be doubled.`, true); return; }
  edit(() => {
    for (let s = len; s < len * 2; s++) steps[s] = steps[s - len].map((o) => ({ n: o.n, v: o.v, l: o.l, x: o.x, s }));
    commit(Array.from({ length: len }, (_, i) => len + i));
    KS2.setParam(P, 'length', len * 2);
    return true;
  });
  selection = new Set();
  say(`Steps 1 to ${len} repeated as ${len + 1} to ${len * 2}.`);
  renderAll();
}

function setNoteField(field, value) {
  const o = single();
  if (!o) return;
  edit(() => {
    if (field === 'n') return place([{ note: o, s: o.s, n: clamp(value, 0, 127) }]);
    if (field === 's') return place([{ note: o, s: clamp(value - 1, 0, 63), n: o.n }]);
    o[field] = field === 'v' ? clamp(value, 1, 127) : clamp(value, 1, KS2.MAX_NOTE_LENGTH);
    if (field === 'v') lastVel = o.v; else lastLen = o.l;
    commit([o.s]);
    return true;
  });
}

function setGroupField(field, value) {
  edit(() => {
    for (const o of selection) o[field] = field === 'v' ? clamp(value, 1, 127) : clamp(value, 1, KS2.MAX_NOTE_LENGTH);
    commit(picked().map((o) => o.s));
    return true;
  });
}

function setParam(key, value) {
  edit(() => { KS2.setParam(P, key, value); return true; });
}

// ---- rendering: chrome -----------------------------------------------------
const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? 'Cmd' : 'Ctrl';
const HINT = `Click: add.  Shift+drag: select.  Alt+drag: copy.  ${MOD}+D: duplicate.  Scroll: pan.  ${MOD}+scroll: zoom time.  Alt+scroll: zoom keys.  F: fit.`;
let sayTimer = 0;
function say(text, alert) {
  $('status').textContent = text || (file ? HINT : '');
  $('status').classList.toggle('alert', !!alert && !!text);
  clearTimeout(sayTimer);
  if (text) sayTimer = setTimeout(() => say(''), 5000);
}

function renderAll() { renderChrome(); renderSlots(); renderSettings(); renderNote(); renderRaw(); draw(); }

function renderChrome() {
  $('fileLabel').innerHTML = file ? `<b>${esc(fileName)}</b>${dirty ? ' <span class="dirty">edited</span>' : ''}` : '';
  $('undoBtn').disabled = !undoStack.length;
  $('redoBtn').disabled = !redoStack.length;
  $('saveBtn').disabled = $('playBtn').disabled = $('fitBtn').disabled = !file;
  $('copyBtn').disabled = !file || isBlank(P);
  $('pasteBtn').disabled = !clipboard;
  $('clearBtn').disabled = !file || !steps.some((s) => s.length);
  deviceButtons();
  $('drop').hidden = !pristine || !!xfer;
  if (!file) return;
  const count = steps.reduce((a, s) => a + s.length, 0);
  const picks = selection.size > 1 ? `, ${selection.size} selected` : '';
  $('where').textContent = `Bank ${bank}, pattern ${number}: ${isBlank(P) ? 'empty slot' : count + ' notes' + picks}`;
  const ok = isBlank(P) || KS2.storedChecksum(P.blob) === (KS2.xorSum(P.blob) ^ KS2.CHECKSUM_BIAS);
  $('checksum').textContent = isBlank(P) ? '' : ok ? 'Checksum OK' : 'Checksum differs from expected';
  $('checksum').className = ok ? '' : 'bad';
  if (!$('status').textContent) say('');
}

function slotPreview(p) {
  if (isBlank(p)) return '<svg viewBox="0 0 64 26" aria-hidden="true"></svg>';
  const st = KS2.readSteps(p.blob), all = st.flat().map((o) => o.n);
  const lo = Math.min(...all), hi = Math.max(...all), span = Math.max(hi - lo, 6);
  const len = KS2.getParam(p, 'length');
  let rects = '';
  st.forEach((notes, i) => notes.forEach((o) => {
    const y = 1 + (1 - (o.n - lo) / span) * 22;
    rects += `<rect x="${i}" y="${y.toFixed(1)}" width="${Math.max(0.9, o.l / 2 - 0.15)}" height="2"${i >= len ? ' opacity=".25"' : ''}/>`;
  }));
  return `<svg viewBox="0 0 64 26" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>`;
}

const NO_BLOB = new Uint8Array(4096).fill(0xff);
function renderSlots() {
  // During a full read the list shows the bank being read, filling in as patterns arrive.
  const reading = !!(xfer && xfer.blobs);
  renderSlotList(reading, reading ? xfer.bank : bank, reading ? xfer.number : number);
}

function renderSlotList(reading, bank, number) {
  const source = (n) => {
    if (!reading) return getPattern(bank, n);
    const blob = (n === xfer.number && xfer.partial) || xfer.blobs.get(KS2.patternKey(bank, n)) || NO_BLOB;
    return { blob, params: KS2.paramsFromBlob(blob) };
  };
  $('banks').innerHTML = [1, 2, 3, 4].map((b) =>
    `<button data-bank="${b}" aria-pressed="${b === bank}" title="Bank ${b}"${reading ? ' disabled' : ''}>${b}</button>`).join('');
  let html = '';
  for (let n = 1; n <= 16; n++) {
    const p = source(n);
    if (!p) continue;
    const blank = isBlank(p) || !KS2.readSteps(p.blob).some((notes) => notes.length);
    html += `<button class="slot${blank ? ' empty' : ''}" data-number="${n}" aria-pressed="${n === number}"
      aria-label="Pattern ${n}${blank ? ', empty' : ''}"><span class="num">${n}</span>${slotPreview(p)}
      <span class="len" title="Length in steps">${isBlank(p) ? '' : KS2.getParam(p, 'length')}</span></button>`;
  }
  $('slots').innerHTML = html;
}

function renderSettings() {
  $('settings').innerHTML = KS2.PARAMS.map((d) => {
    const id = 'p_' + d.key;
    if (d.list) {
      const v = KS2.getParam(P, d.key);
      return `<label for="${id}">${d.label}</label><select id="${id}" data-param="${d.key}">${d.list.map((s, i) =>
        `<option value="${i}"${i === v ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>`;
    }
    const s = d.scale || 1, unit = d.zeroOff ? '0 = off' : d.unit || '';
    return `<label for="${id}">${d.label}</label><span class="with-unit">
      <input id="${id}" data-param="${d.key}" type="number" min="${d.min * s}" max="${d.max * s}" step="${s}" value="${KS2.getParam(P, d.key)}">
      <span class="unit">${unit}</span></span>`;
  }).join('');
  const len = patternLength(), can = !isBlank(P) && len * 2 <= 64;
  $('doubleBtn').disabled = !can;
  $('doubleBtn').title = can
    ? `Repeat steps 1 to ${len} as ${len + 1} to ${len * 2} and set the length to ${len * 2}`
    : isBlank(P) ? 'Empty slot' : `A pattern holds 64 steps; ${len} cannot be doubled`;
}

function renderNote() {
  const row = (label, f, attrs, unit) => `<label for="n_${f}">${label}</label><span class="with-unit">
    <input id="n_${f}" type="number" data-note="${f}" ${attrs}><span class="unit">${unit}</span></span>`;
  const actions = `<div class="pair"><button id="dupBtn" title="Repeat right after (${MOD}+D)">Duplicate</button>
    <button id="deleteBtn" title="Delete (Del)">Delete</button></div>`;
  const o = single();
  if (o) {
    $('noteBox').innerHTML = `<div class="rows">
      ${row('Pitch', 'n', `min="0" max="127" value="${o.n}"`, KS2.noteName(o.n))}
      ${row('Step', 's', `min="1" max="64" value="${o.s + 1}"`, '')}
      ${row('Velocity', 'v', `min="1" max="127" value="${o.v}"`, '')}
      ${row('Length', 'l', `min="0.5" max="64" step="0.5" value="${o.l / 2}"`, 'steps')}</div>${actions}`;
  } else if (selection.size) {
    const same = (f) => (picked().every((p) => p[f] === picked()[0][f]) ? picked()[0][f] : null);
    const v = same('v'), l = same('l');
    $('noteBox').innerHTML = `<div class="empty-note">${selection.size} notes selected.</div><div class="rows">
      ${row('Velocity', 'gv', `min="1" max="127" value="${v ?? ''}" placeholder="mixed"`, '')}
      ${row('Length', 'gl', `min="0.5" max="64" step="0.5" value="${l ? l / 2 : ''}" placeholder="mixed"`, 'steps')}</div>${actions}`;
  } else {
    $('noteBox').innerHTML = `<div class="empty-note">${isBlank(P) ? 'Empty slot. Click the grid to add the first note.' : 'No note selected.'}</div>`;
  }
}

const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join(' ');

function renderRaw() {
  if (!$('raw').open) return;
  if (isBlank(P)) { $('rawBody').innerHTML = '<p>Empty slot: all 4096 bytes are FF.</p>'; return; }
  const b = P.blob, s = selection.size ? Math.min(...picked().map((o) => o.s)) : 0, o = KS2.STEPS_OFFSET + s * KS2.RECORD_SIZE;
  const rec = (label, from, len) => `<dt>+${from} ${label}</dt><dd class="hex">${hex(b.subarray(o + from, o + from + len))}</dd>`;
  const stored = KS2.storedChecksum(b), calc = KS2.xorSum(b) ^ KS2.CHECKSUM_BIAS;
  const hx = (v) => v.toString(16).toUpperCase().padStart(4, '0');
  const known = new Set(KS2.PARAMS.map((d) => d.offset));
  const other = [];
  for (let off = 1; off < KS2.STEPS_OFFSET; off += 2) {
    const w = KS2.word(b, off);
    if (!known.has(off) && w) other.push(`${off}:${hx(w)}`);
  }
  $('rawBody').innerHTML = `
    <h3>Step ${s + 1} record at ${o}</h3>
    <dl>${rec('Notes (80 = empty)', 0, 8)}${rec('Velocities', 8, 8)}${rec('Lengths, half-steps', 16, 8)}
      ${rec('Unknown, always 00', 24, 8)}${rec('Flags (byte 34 = has notes)', 32, 4)}</dl>
    <h3>Checksum at ${KS2.CHECKSUM_OFFSET}</h3>
    <table><tr><th>Stored</th><td class="hex">${hx(stored)}</td><th>Computed</th>
      <td class="hex${stored === calc ? '' : ' bad'}">${hx(calc)}</td></tr></table>
    <p>XOR of the 96 header words and every step byte, XOR 3FFF.</p>
    <h3>Header words</h3>
    <table><tr><th></th><th>Offset</th><th>Word</th></tr>${KS2.PARAMS.map((d) => `<tr><th>${d.label}</th>
      <td class="hex">${d.offset}</td><td class="hex">${hx(KS2.word(b, d.offset))}</td></tr>`).join('')}</table>
    <p>15-bit: stored value ÷ range × 32767. Other non-zero words (offset:value):</p>
    <p class="hex">${other.join(' ')}</p>`;
}

// ---- rendering: piano roll --------------------------------------------------
let frameQueued = false;
function draw() {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(() => { frameQueued = false; paint(); });
}

function lightKey(pitch, ms) {
  lit.set(pitch, performance.now() + ms);
  draw();
  setTimeout(draw, ms + 20);
}

function paint() {
  if (xfer) renderXfer();
  const live = !!(xfer && xfer.steps); // notes arriving from the device
  paintRoll(live ? xfer.steps : steps, live);
}

function paintRoll(steps, live) {
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  if ((!file && !live) || !W || !H) return;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  }
  clampView();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement), c = (n) => cs.getPropertyValue(n).trim();
  const col = { bg: c('--bg'), panel: c('--panel'), surface: c('--surface'), sunken: c('--sunken'), ink: c('--ink'),
    muted: c('--muted'), line: c('--line'), strong: c('--line-strong'), note: c('--note'), accent: c('--accent'),
    playhead: c('--playhead'), keyWhite: c('--key-white'), keyBlack: c('--key-black'), select: c('--select'),
    hover: c('--hover') };
  const cw = view.colW, rh = view.rowH, len = live ? 64 : patternLength(), GH = tall(), GB = RULER + GH, VT = velTop();
  const font = cs.getPropertyValue('--font');
  const now = performance.now();
  for (const [p, until] of lit) if (until <= now) lit.delete(p);
  const sounding = (p) => p === heldKey || lit.has(p);
  ctx.fillStyle = col.surface; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle';

  const pHi = Math.min(127, Math.ceil(view.top) - 1), pLo = Math.max(0, Math.floor(view.top - GH / rh) - 1);
  const sLo = Math.max(0, Math.floor(view.step0)), sHi = Math.min(64, Math.ceil(view.step0 + wide() / cw));

  // ---- grid ----
  ctx.save();
  ctx.beginPath(); ctx.rect(KEYW, RULER, W - KEYW, GH); ctx.clip();
  for (let p = pHi; p >= pLo; p--) {
    const y = yOf(p);
    if (BLACK[p % 12]) { ctx.fillStyle = col.sunken; ctx.fillRect(KEYW, y, W, rh); }
    if (p % 12 === 0 || p % 12 === 5) { ctx.fillStyle = col.line; ctx.fillRect(KEYW, y + rh - 0.5, W, 1); }
  }
  if (hover && (hover.zone === 'grid' || hover.zone === 'keys') && !box) {
    ctx.fillStyle = col.hover; ctx.fillRect(KEYW, yOf(hover.pitch), W, rh);
  }
  ctx.restore();

  const columns = (top, height) => {
    for (let s = sLo; s <= sHi; s++) {
      if (s % 4 && cw < 6) continue;
      ctx.fillStyle = s % 16 === 0 ? col.strong : col.line;
      ctx.globalAlpha = s % 4 === 0 ? 1 : 0.45;
      const x = Math.round(xOf(s));
      if (x >= KEYW) ctx.fillRect(x - 0.5, top, 1, height);
    }
    ctx.globalAlpha = 1;
  };
  columns(RULER, GH);

  // velocity lane ground
  ctx.fillStyle = col.panel; ctx.fillRect(0, GB, W, H - GB);
  ctx.fillStyle = col.line; ctx.fillRect(0, GB - 0.5, W, 1);
  columns(VT, VELH);

  ctx.save();
  ctx.beginPath(); ctx.rect(KEYW, RULER, W - KEYW, H - RULER); ctx.clip();
  if (playing && playhead >= 0) {
    ctx.fillStyle = col.playhead; ctx.globalAlpha = 0.2;

canvas.addEventListener('pointerdown', (e) => {

canvas.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); }); // no autoscroll puck

canvas.addEventListener('dblclick', removeAt);

// ---- keyboard ---------------------------------------------------------------
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]') || xfer) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'o') { e.preventDefault(); $('fileInput').click(); return; }
  if (!file) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? restore(redoStack, undoStack) : restore(undoStack, redoStack); return; }
  if (mod && k === 's') { e.preventDefault(); saveCopy(); return; }
  if (typing) return;
  if (mod && (k === 'd' || k === 'b')) { e.preventDefault(); duplicateSelection(); return; }
  if (mod && k === 'a') { e.preventDefault(); selection = new Set(steps.flat()); renderAll(); return; }
  if (mod) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (k === 'f') { fitAll(); return; }
  if (k === 'd' && selection.size) { duplicateSelection(); return; }
  if (!selection.size) return;
  const arrows = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
  if (arrows) {
    e.preventDefault();
    const stretch = e.shiftKey && arrows[0];
    const ok = edit(() => (stretch ? stretchSelection(arrows[0]) : moveSelection(arrows[0], arrows[1] * (e.shiftKey ? 12 : 1))));
    if (ok && !stretch) { if (arrows[1] && single()) audition(single()); reveal(picked()[0]); draw(); }

// ---- sound ------------------------------------------------------------------
let ac = null, master = null, playing = false, playhead = -1, nextTime = 0, playStep = 0, timer = 0, queue = [];

function audio() {

    master = ac.createGain(); master.gain.value = 0.22;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    master.connect(lp).connect(ac.destination);

}

function voice(pitch, vel, t, dur) {
  const osc = ac.createOscillator(), g = ac.createGain();

  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.005);
  g.gain.setValueAtTime(peak, t + Math.max(dur, 0.03));
  g.gain.linearRampToValueAtTime(0, t + Math.max(dur, 0.03) + 0.05);
  osc.connect(g).connect(master);
  osc.start(t); osc.stop(t + Math.max(dur, 0.03) + 0.06);
}

function blip(pitch, vel) {
  if (pitch < 0 || pitch > 127) return;
  lightKey(pitch, 180);
  if (soundOn) { audio(); voice(pitch, vel, ac.currentTime, 0.14); }
}
function audition(note) { if (!playing) blip(note.n, note.v); }

function stepSeconds() {
  const name = KS2.formatParam(P, 'division'), m = name.match(/^1\/(\d+)([DT]?)$/);
  let beats = m ? 4 / +m[1] : 0.25;
  if (m && m[2] === 'D') beats *= 1.5;
  if (m && m[2] === 'T') beats *= 2 / 3;
  return 60 / KS2.getParam(P, 'tempo') * beats;
}

const noteSeconds = (o, d, gate) => (o.l >= 2 ? d * (o.l / 2 - 1 + gate) : d * gate / 2);

function schedule() {
  while (nextTime < ac.currentTime + 0.12) {
    const d = stepSeconds(), len = patternLength(), gate = KS2.getParam(P, 'gate') / 100;
    if (playStep >= len) playStep = 0;
    const t = nextTime + (playStep % 2 ? (KS2.getParam(P, 'swing') / 50 - 1) * d : 0);
    for (const o of steps[playStep]) voice(o.n, o.v, t, noteSeconds(o, d, gate));
    queue.push({ step: playStep, t });
    nextTime += d; playStep++;

function frame() {
  if (!playing) return;
  while (queue.length > 1 && queue[1].t <= ac.currentTime) queue.shift();
  const now = queue.length && queue[0].t <= ac.currentTime ? queue[0].step : playhead;
  if (now !== playhead) {
    playhead = now;
    const d = stepSeconds(), gate = KS2.getParam(P, 'gate') / 100;
    for (const o of steps[now] || []) lightKey(o.n, Math.max(60, noteSeconds(o, d, gate) * 1000));
    draw();

  audio();

}
function stop() {
  if (!playing) return;
  playing = false; clearInterval(timer); playhead = -1; lit.clear();
  $('playBtn').textContent = 'Play'; $('playBtn').setAttribute('aria-pressed', 'false');
  draw();
}

});
$('noteBox').addEventListener('click', (e) => {
  if (e.target.id === 'deleteBtn' && selection.size) edit(() => removeNotes(picked()));
  if (e.target.id === 'dupBtn') duplicateSelection();
});

$('copyBtn').onclick = () => {
  clipboard = { blob: P.blob.slice(), params: { ...P.params }, bias: P.bias };
  renderChrome(); say(`Copied pattern ${bank}-${number}. Select a slot and paste.`);
};
$('pasteBtn').onclick = () => {
  if (!clipboard) return;
  snapshot();
  P.blob = clipboard.blob.slice(); P.params = { ...clipboard.params }; P.bias = clipboard.bias;
  selectPattern(bank, number);
};
$('clearBtn').onclick = () => {
  if (isBlank(P) || !steps.some((s) => s.length)) return;
  edit(() => removeNotes(steps.flat()));
};
$('raw').addEventListener('toggle', renderRaw);

// drag and drop anywhere in the window
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragover'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragover'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragover');
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});

addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
new ResizeObserver(draw).observe(canvas);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

// ---- device (Web MIDI) ----------------------------------------------------------
let device = null, busy = false;
let xfer = null; // the transfer in progress, shown in the header above the roll

class Cancelled extends Error {}

/** `parts` is how many segments the progress track has: 64 for a full read, 1 or 2 otherwise. */
function beginXfer(title, parts, options = {}) {
  xfer = { title, parts, part: 0, frac: 0, big: '', note: '', started: performance.now(), cancel: false, cancellable: options.cancellable !== false,
    steps: null, arrived: 0, blobs: options.blobs || null, partial: null, bank, number, view: { ...view }, drawn: -1 };
  $('xferTrack').innerHTML = '<i></i>'.repeat(parts);
  $('xferTrack').classList.toggle('banked', !!options.blobs);
  $('xferBanks').hidden = !options.blobs; $('xferNote').hidden = !!options.blobs;
  $('xferCancel').hidden = !xfer.cancellable; $('xferCancel').disabled = false;
  $('xfer').hidden = false; $('drop').hidden = true;
  pristine = false;
  selection = new Set(); box = null; hover = null;
  draw();
}

function endXfer() {
  if (!xfer) return;
  Object.assign(view, xfer.view);
  xfer = null;
  $('xfer').hidden = true;
}

function renderXfer() {
  const progress = (xfer.part + xfer.frac) / xfer.parts, elapsed = (performance.now() - xfer.started) / 1000;
  const left = progress > 0.02 ? elapsed * (1 - progress) / progress : NaN;
  $('xferTitle').textContent = xfer.title;
  $('xferBig').innerHTML = xfer.big;
  $('xferNote').textContent = xfer.note;
  $('xferLeft').textContent = Number.isNaN(left) ? '' : left >= 60 ? `${Math.floor(left / 60)} min ${Math.round(left % 60)} s left` : `${Math.max(1, Math.ceil(left))} s left`;
  $('xferElapsed').textContent = `${Math.round(elapsed)} s elapsed`;
  [...$('xferTrack').children].forEach((el, i) => {
    el.className = i < xfer.part ? 'done' : i === xfer.part ? 'now' : '';
    if (i === xfer.part) el.style.setProperty('--w', (xfer.frac * 100).toFixed(0) + '%');
  });
}

/** Progress callback for block transfers. With a partial blob, the roll shows its notes arriving. */
function onBlocks(done, total, partial) {
  if (xfer.cancel) throw new Cancelled();
  xfer.frac = done / total;
  if (partial) {
    xfer.partial = partial;
    xfer.arrived = clamp((done * 32 - KS2.STEPS_OFFSET) / KS2.RECORD_SIZE, 0, 64);
    const whole = Math.floor(xfer.arrived);
    if (whole !== xfer.drawn) {
      xfer.drawn = whole;
      xfer.steps = KS2.readSteps(partial).map((notes, s) => (s < whole ? notes : []));
      // Keep every arrived note in view; zoom the keys out only as far as needed.
      const pitches = xfer.steps.flat().map((o) => o.n);
      if (pitches.length) {
        const lo = Math.min(...pitches), hi = Math.max(...pitches);
        if (hi >= view.top - 2 || lo < view.top - tall() / view.rowH + 2 || !xfer.fitted) {
          view.rowH = clamp(tall() / (hi - lo + 13), 6, 14);
          view.top = (hi + lo + 1) / 2 + tall() / view.rowH / 2;
          xfer.fitted = true;
        }
      }
      view.colW = 0; view.step0 = 0; clampView();
      if (xfer.blobs && whole % 8 === 0) renderSlots();
    }
  }
  draw();
}

function deviceButtons() {
  $('midiBtn').textContent = device ? 'KeyStep' : 'Connect KeyStep';
  $('midiBtn').title = device ? 'KeyStep mk2 connected over USB' : 'Connect to a KeyStep mk2 over USB (Chrome or Edge)';
  $('midiBtn').setAttribute('aria-pressed', !!device);
  $('readAllBtn').disabled = !device || busy;
  $('readOneBtn').disabled = !device || busy || !file;
  $('sendBtn').disabled = !device || busy || !file || isBlank(P);
  $('sendAllBtn').disabled = !device || busy || !file || ![...file.patterns.values()].some((p) => !isBlank(p));
}

function confirmAction(text, okLabel) {
  return new Promise((resolve) => {
    const dlg = $('confirmDlg');
    $('confirmText').textContent = text; $('confirmOk').textContent = okLabel;
    dlg.onclose = () => resolve(dlg.returnValue === 'ok');
    dlg.returnValue = 'cancel';
    dlg.showModal();
  });
}

async function connectDevice() {
  if (device) { say('KeyStep mk2 is connected.'); return; }
  if (!navigator.requestMIDIAccess) { say('This browser has no Web MIDI. Use Chrome or Edge.', true); return; }
  let access;
  try {
    access = await navigator.requestMIDIAccess({ sysex: true });
  } catch (e) {
    say('MIDI access was refused. Allow MIDI devices for this page and try again.', true); return;
  }
  const transport = KS2MIDI.webMidiTransport(access);
  if (!transport) { say('No KeyStep mk2 found. Connect it by USB, then try again.', true); return; }
  const candidate = new KS2MIDI.Device(transport);
  if (!(await candidate.probe())) { say('The KeyStep does not answer. Close MIDI Control Center and try again.', true); return; }
  device = candidate;
  // The device computes the checksum itself, so every pattern it sends must satisfy it.
  device.verify = (blob) => KS2.isEmpty(blob) || KS2.storedChecksum(blob) === (KS2.xorSum(blob) ^ KS2.CHECKSUM_BIAS);
  access.onstatechange = () => {
    if (device && ![...access.outputs.values()].some((port) => /keystep/i.test(port.name || '') && port.state === 'connected')) {
      device = null; deviceButtons(); say('KeyStep disconnected.', true);
    }
  };
  deviceButtons();
  say(`Connected to ${transport.name}.`);
}

async function transfer(label, fn) {
  if (busy || !device) return;
  busy = true; deviceButtons();
  try {
    await fn();
  } catch (e) {
    if (e instanceof Cancelled) say(`${label} cancelled. Nothing here was changed.`);
    else say(`${label} failed: ${e.message}`, true);
  } finally {
    endXfer();
    busy = false;
    if (file) renderAll(); else { $('slots').innerHTML = ''; $('banks').innerHTML = ''; deviceButtons(); }
  }
}

async function readAllFromDevice() {
  if (dirty && !(await confirmAction('Reading the device opens a new project and discards the unsaved edits here.', 'Read all'))) return;
  await transfer('Reading', async () => {
    stop();
    const blobs = new Map();
    beginXfer('Reading from KeyStep mk2', 64, { blobs });
    try {
      for (let b = 1; b <= 4; b++) {
        for (let n = 1; n <= 16; n++) {
          Object.assign(xfer, { part: blobs.size, frac: 0, bank: b, number: n, partial: null, steps: Array.from({ length: 64 }, () => []), arrived: 0, drawn: -1, fitted: false });
          xfer.big = `Pattern ${blobs.size + 1} <span>of 64</span>`;
          $('status').textContent = `Reading bank ${b}, pattern ${n} from the KeyStep…`;
          renderSlots();
          blobs.set(KS2.patternKey(b, n), (await device.readPattern(b, n, onBlocks)).slice());
        }
      }
    } catch (e) {
      // Cancelled: keep every pattern that arrived whole; the one in progress is dropped.
      if (!(e instanceof Cancelled) || !blobs.size) throw e;
    }
    const partial = blobs.size < 64;
    endXfer();
    file = KS2.createProject(blobs);
    fileName = partial ? `KeyStep mk2 device, first ${blobs.size} patterns.keystep2` : 'KeyStep mk2 device.keystep2';
    dirty = false; undoStack = []; redoStack = []; clipboard = null;
    selectPattern(1, 1);
    say(partial
      ? `Stopped. Kept the ${blobs.size} pattern${blobs.size === 1 ? '' : 's'} already read; the other slots are empty here. The KeyStep is unchanged.`
      : 'Read 64 patterns from the KeyStep.', partial);
  });
}

async function readOneFromDevice() {
  await transfer('Reading', async () => {
    stop();
    beginXfer('Reading from KeyStep mk2', 1);
    xfer.big = `Bank ${bank}, <span>pattern</span> ${number}`;
    xfer.note = 'Replaces this slot in the editor. Undo brings the old one back.';
    xfer.steps = Array.from({ length: 64 }, () => []);
    $('status').textContent = `Reading bank ${bank}, pattern ${number} from the KeyStep…`;
    const blob = (await device.readPattern(bank, number, onBlocks)).slice();
    endXfer();
    snapshot();
    P.blob = blob; P.params = KS2.paramsFromBlob(blob);
    P.bias = isBlank(P) ? KS2.CHECKSUM_BIAS : KS2.storedChecksum(blob) ^ KS2.xorSum(blob);
    selectPattern(bank, number);
    say(`Read bank ${bank}, pattern ${number} from the KeyStep.`);
  });
}

function wireParams(pattern, blob) {
  return KS2MIDI.PARAM_ORDER.map((id) => {
    const def = KS2.PARAM_BY_ID.get(id);
    return { id, raw: pattern.params[id] === undefined ? KS2.paramsFromBlob(blob)[id] : pattern.params[id], range: def.range };
  });
}

/** Writes one pattern, reads it back and compares notes and settings. `part` is its first of two track segments. */
async function writeAndCheck(pattern, part) {
  const blob = pattern.blob.slice(), where = `bank ${pattern.bank}, pattern ${pattern.number}`;
  const stopping = () => (xfer.cancel ? 'Stopping after this pattern. ' : '');
  xfer.part = part; xfer.frac = 0; xfer.note = stopping() + 'Writing. Keep the KeyStep connected.';
  await device.writePattern(pattern.bank, pattern.number, blob, wireParams(pattern, blob), (done, total) => { xfer.frac = done / total; draw(); });
  xfer.part = part + 1; xfer.frac = 0; xfer.note = stopping() + 'Reading it back to compare.';
  const back = await device.readPattern(pattern.bank, pattern.number, (done, total) => { xfer.frac = done / total; draw(); });
  for (let i = KS2.STEPS_OFFSET; i < KS2.STEPS_END; i++) if (back[i] !== blob[i]) throw new Error(`the device holds different notes in ${where} than were sent`);
  const want = KS2.paramsFromBlob(blob), got = KS2.paramsFromBlob(back);
  for (const id of KS2MIDI.PARAM_ORDER) if (want[id] !== got[id]) throw new Error(`the device holds a different ${KS2.PARAM_BY_ID.get(id).label.toLowerCase()} in ${where} than was sent`);
}

async function sendToDevice() {
  const pattern = P, where = `bank ${bank}, pattern ${number}`;
  if (!(await confirmAction(`Send ${where} to the KeyStep? It replaces that pattern on the device.`, 'Send'))) return;
  await transfer('Sending', async () => {
    stop();
    // Two halves: write, then read back and compare. A write is not cancellable: half a pattern is worse than either.
    beginXfer('Sending to KeyStep mk2', 2, { cancellable: false });
    xfer.big = `Bank ${pattern.bank}, <span>pattern</span> ${pattern.number}`;
    $('status').textContent = `Sending ${where} to the KeyStep…`;
    await writeAndCheck(pattern, 0);
    endXfer();
    say(`Sent ${where} and read it back: it matches.`);
  });
}

async function sendAllToDevice() {
  const list = [...file.patterns.values()].filter((p) => !isBlank(p)).sort((a, b) => a.bank - b.bank || a.number - b.number);
  if (!list.length) return;
  const skipped = 64 - list.length;
  const text = `Send ${list.length} pattern${list.length === 1 ? '' : 's'} to the KeyStep? Each replaces the same slot on the device.`
    + (skipped ? ` The ${skipped} empty slot${skipped === 1 ? '' : 's'} here ${skipped === 1 ? 'is' : 'are'} skipped and left as ${skipped === 1 ? 'it is' : 'they are'} on the device.` : '')
    + ` This takes about ${list.length * 3.5 < 90 ? Math.round(list.length * 3.5) + ' seconds' : Math.round(list.length * 3.5 / 60) + ' minutes'}.`;
  if (!(await confirmAction(text, 'Send all'))) return;
  await transfer('Sending', async () => {
    stop();
    beginXfer('Sending to KeyStep mk2', list.length * 2);
    let sent = 0;
    for (const pattern of list) {
      // Cancel takes effect between patterns, never inside one.
      if (xfer.cancel) break;
      const saved = xfer.view;
      selectPattern(pattern.bank, pattern.number); xfer.view = saved;
      xfer.big = `Pattern ${sent + 1} <span>of ${list.length}</span>`;
      $('status').textContent = `Sending bank ${pattern.bank}, pattern ${pattern.number} to the KeyStep…`;
      await writeAndCheck(pattern, sent * 2);
      sent++;
    }
    const stopped = sent < list.length;
    endXfer();
    say(stopped
      ? `Stopped. Sent and checked ${sent} of ${list.length} patterns; the rest are unchanged on the KeyStep.`
      : `Sent ${sent} pattern${sent === 1 ? '' : 's'} and read each back: all match.`, stopped);
  });
}

$('xferCancel').onclick = () => {
  if (!xfer || !xfer.cancellable) return;
  xfer.cancel = true; $('xferCancel').disabled = true;
  if (!xfer.blobs && xfer.parts > 2) xfer.note = 'Stopping after this pattern. ' + xfer.note;
};
$('midiBtn').onclick = connectDevice;
$('readAllBtn').onclick = readAllFromDevice;
$('readOneBtn').onclick = readOneFromDevice;
$('sendBtn').onclick = sendToDevice;
$('sendAllBtn').onclick = sendAllToDevice;

// ---- skin ---------------------------------------------------------------------
function setSkin(name) {
  const buttons = [...$('skins').querySelectorAll('[data-skin]')];
  const known = buttons.some((b) => b.dataset.skin === name);
  document.documentElement.dataset.skin = known ? name : 'light';
  for (const b of buttons) b.setAttribute('aria-pressed', b.dataset.skin === document.documentElement.dataset.skin);
  try { localStorage.setItem('ks2-skin', document.documentElement.dataset.skin); } catch (e) { /* storage unavailable */ }
  draw();
}
$('skins').onclick = (e) => { const b = e.target.closest('[data-skin]'); if (b) setSkin(b.dataset.skin); };
let savedSkin = null;
try { savedSkin = localStorage.getItem('ks2-skin'); } catch (e) { /* storage unavailable */ }
setSkin(savedSkin || 'light');
document.fonts && document.fonts.ready.then(draw);

// Start with an empty project: every slot can be selected, read from the device, edited and sent.
function newProject() {
  file = KS2.createProject(new Map()); fileName = 'Untitled.keystep2'; dirty = false;
  undoStack = []; redoStack = []; clipboard = null;
  selectPattern(1, 1);
  pristine = true;
  renderChrome();
}
newProject();

// Served over http next to an export: open it straight away.
if (location.protocol.startsWith('http')) {
  fetch('export.keystep2').then((r) => (r.ok ? r.arrayBuffer() : null))
    .then((buf) => { if (buf && pristine) loadBytes(new Uint8Array(buf), 'export.keystep2'); })
    .catch(() => {});
}
</script>
